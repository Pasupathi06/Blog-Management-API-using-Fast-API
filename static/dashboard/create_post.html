<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 18px 0 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .option {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
        }

        .option input {
            width: auto;
            margin-right: 8px;
        }

        .schedule-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .schedule-row {
            display: flex;
            gap: 15px;
        }

        .schedule-row > div {
            flex: 1;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            background: #e5e7eb;
            color: #111827;
        }

        .create {
            background: #2563eb;
            color: white;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .schedule-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Blog Post</h1>

        <div class="subtitle">
            Create and publish your blog post.
        </div>

        <form id="createPostForm">

            <label for="title">Title *</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter blog title"
                required
            >

            <label for="content">Content *</label>
            <textarea
                id="content"
                name="content"
                placeholder="Write your blog content..."
                required
            ></textarea>

            <label>Publish Options</label>

            <div class="options">

                <label class="option">
                    <input
                        type="radio"
                        name="publish_option"
                        value="published"
                        checked
                    >
                    Publish Now
                </label>

                <label class="option">
                    <input
                        type="radio"
                        name="publish_option"
                        value="draft"
                    >
                    Save as Draft
                </label>

                <label class="option">
                    <input
                        type="radio"
                        name="publish_option"
                        value="scheduled"
                    >
                    Schedule Post
                </label>

            </div>

            <div id="scheduleBox" class="schedule-box">

                <div class="schedule-row">

                    <div>
                        <label for="scheduleDate">Date</label>
                        <input
                            type="date"
                            id="scheduleDate"
                        >
                    </div>

                    <div>
                        <label for="scheduleTime">Time</label>
                        <input
                            type="time"
                            id="scheduleTime"
                        >
                    </div>

                </div>

            </div>

            <label for="images">Image (Optional)</label>

            <input
                type="file"
                id="images"
                name="images"
                accept="image/jpeg,image/png,image/webp"
            >

            <div class="buttons">

                <button
                    type="button"
                    class="cancel"
                    id="cancelButton"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="create"
                    id="createButton"
                >
                    Create Post
                </button>

            </div>

            <div id="message" class="message"></div>

        </form>

    </div>

</div>

<script>

const form = document.getElementById("createPostForm");
const scheduleBox = document.getElementById("scheduleBox");
const cancelButton = document.getElementById("cancelButton");
const createButton = document.getElementById("createButton");
const messageBox = document.getElementById("message");

const publishOptions = document.querySelectorAll(
    'input[name="publish_option"]'
);

publishOptions.forEach(option => {

    option.addEventListener("change", function () {

        if (this.value === "scheduled") {

            scheduleBox.style.display = "block";

            document.getElementById("scheduleDate").required = true;
            document.getElementById("scheduleTime").required = true;

        } else {

            scheduleBox.style.display = "none";

            document.getElementById("scheduleDate").required = false;
            document.getElementById("scheduleTime").required = false;
        }

    });

});


function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className = "message " + type;

    messageBox.style.display = "block";
}


cancelButton.addEventListener("click", function () {

    form.reset();

    scheduleBox.style.display = "none";

    messageBox.style.display = "none";

});


form.addEventListener("submit", async function (event) {

    event.preventDefault();

    messageBox.style.display = "none";

    const title = document.getElementById("title").value.trim();

    const content = document.getElementById("content").value.trim();

    const option = document.querySelector(
        'input[name="publish_option"]:checked'
    ).value;

    if (!title || !content) {

        showMessage(
            "Title and content are required.",
            "error"
        );

        return;
    }


    const formData = new FormData();

    formData.append("title", title);

    formData.append("content", content);


    if (option === "draft") {

        formData.append("status", "draft");

    }


    if (option === "published") {

        formData.append("status", "published");

    }


    if (option === "scheduled") {

        const date =
            document.getElementById("scheduleDate").value;

        const time =
            document.getElementById("scheduleTime").value;


        if (!date || !time) {

            showMessage(
                "Please select schedule date and time.",
                "error"
            );

            return;
        }


        const scheduledDateTime =
            `${date}T${time}:00`;

        const selectedTime =
            new Date(scheduledDateTime);

        const now = new Date();


        if (selectedTime <= now) {

            showMessage(
                "Scheduled date and time must be in the future.",
                "error"
            );

            return;
        }


        formData.append("status", "scheduled");

        formData.append(
            "scheduled_at",
            scheduledDateTime
        );

    }


    const imageInput =
        document.getElementById("images");


    if (imageInput.files.length > 0) {

        formData.append(
            "images",
            imageInput.files[0]
        );

    }


    createButton.textContent = "Creating...";

    form.classList.add("loading");


    try {

        /*
         * Get JWT token.
         *
         * Your existing login/dashboard page should store
         * the access token in localStorage.
         */

        const token =
            localStorage.getItem("access_token") ||
            localStorage.getItem("token");


        if (!token) {

            showMessage(
                "Please login first. JWT token not found.",
                "error"
            );

            return;
        }


        const response = await fetch(
            "/posts/",
            {
                method: "POST",

                headers: {
                    "Authorization":
                        "Bearer " + token
                },

                body: formData
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Failed to create blog post."
            );

        }


        showMessage(
            "Blog post created successfully!",
            "success"
        );


        form.reset();

        scheduleBox.style.display = "none";


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    } finally {

        createButton.textContent = "Create Post";

        form.classList.remove("loading");

    }

});

</script>

</body>
</html>
