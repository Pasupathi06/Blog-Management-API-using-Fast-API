<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog Management - Login</title>

    <link
        rel="stylesheet"
        href="/static/login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                📝
            </div>

            <!-- Heading -->
            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your Blog Management account
            </p>


            <!-- ========================= -->
            <!-- NORMAL LOGIN -->
            <!-- ========================= -->

            <form id="loginForm">

                <!-- Username / Email -->
                <div class="input-group">

                    <label for="username">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>Remember me</span>

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <!-- ========================= -->
            <!-- DIVIDER -->
            <!-- ========================= -->

            <div class="divider">
                <span>OR</span>
            </div>


            <!-- ========================= -->
            <!-- GOOGLE LOGIN -->
            <!-- ========================= -->

            <button
                type="button"
                class="social-btn google-btn"
                id="googleLoginButton"
                onclick="googleLogin()"
            >

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- ========================= -->
            <!-- FACEBOOK LOGIN -->
            <!-- ========================= -->

            <button
                type="button"
                class="social-btn facebook-btn"
                id="facebookLoginButton"
                onclick="facebookLogin()"
            >

                <span class="facebook-icon">
                    f
                </span>

                <span>
                    Continue with Facebook
                </span>

            </button>


            <!-- ========================= -->
            <!-- REGISTER -->
            <!-- ========================= -->

            <p class="register-text">

                Don't have an account?

                <a
                    href="#"
                    id="registerLink"
                >
                    Create Account
                </a>

            </p>


            <!-- ========================= -->
            <!-- MESSAGE -->
            <!-- ========================= -->

            <div
                id="message"
                role="alert"
                aria-live="polite"
            ></div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="/static/login.js"></script>

</body>

</html>
